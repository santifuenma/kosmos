# ─────────────────────────────────────────────────────────────────────────────
# CI — verifica lint, tests unitarios y build de Next.js en cada push y PR.
#
# Mantenemos un solo job lineal para que el feedback sea predecible y rápido.
# Si en el futuro los tests crecen mucho, se puede dividir lint/test/build
# en jobs paralelos.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cadena de conexión al Postgres del job (ver `services` más abajo). Es un
# contenedor desechable que solo existe durante la ejecución: la contraseña
# no protege nada real.
env:
  CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kosmos_ci

jobs:
  verify:
    name: Lint, test y build
    runs-on: ubuntu-latest

    # Kosmos usa PostgreSQL (Supabase en producción), así que el CI necesita un
    # Postgres real: el schema de Prisma ya no es compatible con SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kosmos_ci
        ports:
          - 5432:5432
        # Esperamos a que acepte conexiones antes de que arranquen los pasos.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Prisma 7 requiere generar el cliente antes de que TypeScript pueda
      # resolver los tipos importados desde @prisma/client.
      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      # Aplicamos las migraciones sobre el Postgres efímero del job. Además de
      # dejar la BD lista para el build, esto comprueba que el historial de
      # migraciones se aplica limpio desde cero sobre PostgreSQL.
      #
      # Prisma 7 lee la URL de las migraciones de DIRECT_URL (ver
      # prisma.config.ts), no de DATABASE_URL.
      - name: Aplicar migraciones (DB de CI)
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          # Sustitutos válidos solo para que el build no falle por variables
          # faltantes; nunca se usan para firmar sesiones reales.
          NEXTAUTH_SECRET: ci-secret-not-used-anywhere
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
